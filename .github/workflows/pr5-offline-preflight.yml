name: PR5 frozen offline preflight
on:
  pull_request:
    paths:
      - 'benchmarks/pr5-offline-preflight.mjs'
      - 'tests/pr5-offline-preflight.test.mjs'
      - 'docs/benchmarks/PR5_OFFLINE_PREFLIGHT.md'
      - '.github/workflows/pr5-offline-preflight.yml'
      - 'src/reviewer.mjs'
      - 'src/review-context.mjs'
      - 'benchmarks/one-shot-journal.mjs'
permissions:
  contents: read
jobs:
  frozen-pr5:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ''
      OPENAI_TEST_API_KEY: ''
      RF_APPROVED_PAID_ATTEMPT: ''
      DATABASE_URL: ''
      STRIPE_SECRET_KEY: ''
      GITHUB_TOKEN: ''
      GITHUB_PRIVATE_KEY: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch frozen public PR5 commits
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/rf-pr5-target"
          git init -q "$target"
          git -C "$target" remote add origin https://github.com/ibboabdoli-ai/reviewforge-sandbox.git
          git -C "$target" fetch -q --no-tags --depth=1 origin \
            420bf122458eb298080bca9e94e6fcfb32339e59 \
            c4054f5e247514c80b76344eb1854e2345aa8037
          git -C "$target" checkout -q --detach c4054f5e247514c80b76344eb1854e2345aa8037
          test "$(git -C "$target" rev-parse HEAD)" = c4054f5e247514c80b76344eb1854e2345aa8037
      - name: Run real engine with synthetic response only
        shell: bash
        env:
          RF_PR5_TARGET: ${{ runner.temp }}/rf-pr5-target
        run: |
          set -euo pipefail
          node --test tests/pr5-offline-preflight.test.mjs
          node benchmarks/pr5-offline-preflight.mjs "$RF_PR5_TARGET" > "$RUNNER_TEMP/rf-pr5-preflight.json"
          cat "$RUNNER_TEMP/rf-pr5-preflight.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync(process.argv[1],"utf8"));
            if(p.mode!=="OFFLINE_MOCK_ONLY" || p.quality!=="NOT_MEASURED" ||
               p.targetHead!=="c4054f5e247514c80b76344eb1854e2345aa8037" ||
               p.coverage?.totalChanged!==8 || p.coverage?.reviewed!==8 ||
               p.coverage?.reviewable!==8 || p.coverage?.complete!==true ||
               p.coverage?.batches!==1 || p.requestBytes>50000 ||
               p.syntheticRequests!==1 || p.realProviderRequests!==0 ||
               p.githubWrites!==0)process.exit(2);
          ' "$RUNNER_TEMP/rf-pr5-preflight.json"
